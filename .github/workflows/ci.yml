name: CI

on:
  push:
    branches: [ "main", "claude/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix crypto
          npm ci --prefix tools
          npm ci --prefix app

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests and capture logs
        run: |
          mkdir -p artifacts
          npm run test:integration 2>&1 | tee artifacts/integration-test.log


      - name: Check compatibility policy gate
        run: npm run check:compat

      - name: Run Playwright E2E
        run: npm run test:e2e:playwright

      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.node-version }}
          path: artifacts/integration-test.log
          if-no-files-found: ignore

      - name: Upload Playwright traces/reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.node-version }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix crypto
          npm ci --prefix tools

      - name: Run npm audit
        run: |
          npm audit --audit-level=high || true
          npm audit --prefix crypto --audit-level=high || true
          npm audit --prefix tools --audit-level=high || true

      - name: Check for sensitive files
        run: |
          echo "Checking for potential secrets..."
          if grep -r "PRIVATE\|SECRET\|PASSWORD\|API_KEY" --include="*.js" --include="*.json" . 2>/dev/null | grep -v "node_modules" | grep -v ".git"; then
            echo "Warning: Potential secrets found in code"
          else
            echo "No obvious secrets detected"
          fi
