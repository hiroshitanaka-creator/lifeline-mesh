name: CI

on:
  push:
    branches: ["main", "master", "claude/*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint_typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix crypto
          npm ci --prefix tools
          npm ci --prefix app

      - name: Run lint
        run: npm run lint

      - name: Run typecheck (crypto + tools)
        run: npm run typecheck

      - name: Run typecheck:runtime (app/src + bluetooth)
        run: npm run typecheck:runtime

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix crypto
          npm ci --prefix tools

      - name: Run unit tests
        run: npm run test:unit

  integration_tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix crypto
          npm ci --prefix tools

      - name: Run integration tests and capture logs
        run: |
          mkdir -p artifacts
          npm run test:integration 2>&1 | tee artifacts/integration-test.log

      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: artifacts/integration-test.log
          if-no-files-found: ignore

  compat_gate:
    name: Compatibility policy gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix tools

      - name: Check compatibility policy gate
        run: npm run check:compat

  e2e_smoke:
    name: E2E smoke (fast gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Run smoke E2E check
        run: npm run test:e2e:smoke

  validate_gate:
    name: Validate gate summary
    runs-on: ubuntu-latest
    needs:
      - lint_typecheck
      - unit_tests
      - integration_tests
      - compat_gate
      - e2e_smoke
    steps:
      - name: CI quality gates passed
        run: |
          echo "Gates: lint + typecheck(crypto/tools) + typecheck:runtime(app/src+bluetooth) + unit + integration + compat + e2e:smoke passed"
          echo "Real-browser Playwright runs in separate workflow (nightly/manual/main push)"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix crypto
          npm ci --prefix tools

      - name: Run npm audit
        run: |
          npm audit --audit-level=high || true
          npm audit --prefix crypto --audit-level=high || true
          npm audit --prefix tools --audit-level=high || true

      - name: Run security audit preparation checks
        run: npm run check:security-audit
      - name: Check for sensitive files
        run: |
          echo "Checking for potential secrets..."
          if grep -r "PRIVATE\|SECRET\|PASSWORD\|API_KEY" --include="*.js" --include="*.json" . 2>/dev/null | grep -v "node_modules" | grep -v ".git"; then
            echo "Warning: Potential secrets found in code"
          else
            echo "No obvious secrets detected"
          fi
